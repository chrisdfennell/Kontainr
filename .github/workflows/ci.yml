name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kontainr.sln

      - name: Build
        run: dotnet build Kontainr.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Kontainr.sln --configuration Release --no-build --verbosity normal
